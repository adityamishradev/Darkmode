<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101012" />
    <meta name="description" content="A private, local-first PDF reader for viewing documents in your browser." />
    <script>
      (() => {
        const theme = localStorage.getItem('pdf-ui-theme') || 'dark'
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <title>PDF Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
